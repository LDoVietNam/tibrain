tibrain:
  port: 1811
  data_dir: "data"
  api_keys:
    - "test-key-123"
    - "dev-key-456"

cli_registry:
  enabled: true

handoff_tracking:
  enabled: true

skill_sync:
  enabled: false

mcp:
  public_name: "tibrain"
  public_mode: "sse"
  expose_upstream_tools: true
  compatibility: true
  # Unified mode: TiBrain acts as both control plane and MCP proxy hub
  # TiBrain provides built-in filesystem tools (read_file, write_file, list_files, etc.)
  internal_hub:
    enabled: true
    url: "http://localhost:1810"
  # MCP server targets - sub-MCP servers that can be registered dynamically
  targets:
    filesystem: "builtin"
    fs: "builtin"
    git: "git-mcp"
    sqlite: "sqlite-mcp"
    postgres: "postgres-mcp"
    github: "github-mcp"
    obsidian: "obsidian-mcp-server"
    browser: "browser-extension"
    # Chrome DevTools MCP - registered as sub-MCP of TiBrain
    chrome-devtools: "chrome-devtools-mcp"
