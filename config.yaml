# TiBrain Configuration
# API keys should be provided via environment variables:
# - MCP_HUB_API_KEY: MCP Hub API key
# - MCPPROXY_API_KEY: MCP Proxy API key
# - TIBRAIN_SECRET_KEY: Fallback encryption key

tibrain:
  port: 1810
  data_dir: "data"

cli_registry:
  enabled: true

handoff_tracking:
  enabled: true

skill_sync:
  enabled: false

mcp:
  public_name: "tibrain"
  public_mode: "sse"
  expose_upstream_tools: true
  compatibility: true
  internal_hub:
    enabled: true
    url: "http://localhost:1810"
  targets:
    filesystem: "builtin"
    fs: "builtin"
    git: "git-mcp"
    sqlite: "sqlite-mcp"
    postgres: "postgres-mcp"
    github: "github-mcp"
    obsidian: "obsidian-mcp-server"
    browser: "browser-extension"
    chrome-devtools: "chrome-devtools-mcp"