name: Integration Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  cli-integration-tests:
    name: CLI Integration Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'
        cache: true
        cache-dependency-path: apps/cli/go.sum

    - name: Run CLI integration tests
      working-directory: apps/cli
      run: |
        go test -v -race -coverprofile=coverage.out ./internal/integration/...

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: apps/cli/coverage.out
        flags: cli-integration
        name: cli-integration-coverage

  router-integration-tests:
    name: Router Integration Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'
        cache: true
        cache-dependency-path: apps/router/go.sum

    - name: Run Router integration tests
      working-directory: apps/router
      run: |
        go test -v -race -coverprofile=coverage.out ./layers/metrics/...

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: apps/router/coverage.out
        flags: router-integration
        name: router-integration-coverage

  e2e-tests:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    needs: [cli-integration-tests, router-integration-tests]
    
    services:
      router:
        image: ghcr.io/ti/router:latest
        ports:
          - 1807:1807
        options: >-
          --health-cmd "curl -f http://localhost:1807/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'
        cache: true
        cache-dependency-path: apps/cli/go.sum

    - name: Build CLI
      working-directory: apps/cli
      run: |
        go build -o ti ./cmd/ti

    - name: Wait for Router to be ready
      run: |
        for i in {1..30}; do
          if curl -f http://localhost:1807/health; then
            echo "Router is ready"
            break
          fi
          echo "Waiting for Router... ($i/30)"
          sleep 2
        done

    - name: Test CLI registration
      working-directory: apps/cli
      run: |
        export TI_ROUTER_AGENT_URL=http://localhost:1807
        export TI_DISABLE_ROUTER_REGISTRATION=true
        ./ti router status

    - name: Verify CLI metrics
      run: |
        response=$(curl -s http://localhost:1807/metrics/prometheus)
        echo "$response"
        if echo "$response" | grep -q "ti_router_cli_registrations_total"; then
          echo "CLI metrics found"
        else
          echo "CLI metrics not found"
          exit 1
        fi
