# Cookie-authenticated OpenAI-compatible upstream providers.
# This feature does not read browser cookie stores or automate login. Supply only
# cookies you are allowed to use. Prefer cookie-env or cookie-file over literal cookie.
cookie-providers:
  - name: "my-web-upstream"
    disabled: false
    prefix: "web"
    base-url: "https://example.com/api/v1"
    path: "/chat/completions"
    cookie-env: "MY_WEB_UPSTREAM_COOKIE"
    # cookie-file: "~/.cli-proxy-api/my-web-upstream.cookie"
    headers:
      X-Client: "CLIProxyAPI"
    proxy-url: "direct"
    models:
      - name: "upstream-model-id"
        alias: "web-model"
