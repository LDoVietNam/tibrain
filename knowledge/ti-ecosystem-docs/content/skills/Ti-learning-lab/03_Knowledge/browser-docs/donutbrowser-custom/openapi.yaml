openapi: 3.0.3
info:
  title: Donut Browser Ultimate API
  description: |
    REST API for Donut Browser Ultimate - an enhanced anti-detect browser with AI automation, workflow management, and database persistence.

    ## Features
    - Anti-detect browser with fingerprint spoofing
    - Multi-engine support (Wayfern/Chromium, Camoufox/Firefox)
    - AI-powered automation with computer vision
    - Workflow builder and execution
    - Profile isolation and management
    - Batch processing for multi-account operations

    ## Authentication
    Admin endpoints require authentication via `DONUT_ADMIN_TOKEN` environment variable.
  version: 1.0.0
  contact:
    name: Donut Browser Ultimate
    url: https://github.com/zhom/donutbrowser
  license:
    name: AGPL-3.0
    url: https://www.gnu.org/licenses/agpl-3.0.en.html

servers:
  - url: http://localhost:10108
    description: Local development server
  - url: https://api.donutbrowser.com
    description: Production server (if available)

tags:
  - name: Profiles
    description: Browser profile management
  - name: Workflows
    description: Workflow management and execution
  - name: AI
    description: AI-powered automation
  - name: Batch
    description: Batch processing operations
  - name: Admin
    description: Administrative operations (requires authentication)
  - name: Health
    description: System health and status

paths:
  /health:
    get:
      tags:
        - Health
      summary: Health check
      description: Check if the API is running and responsive
      operationId: healthCheck
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
                  version:
                    type: string
                    example: 1.0.0
        '503':
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /version:
    get:
      tags:
        - Health
      summary: Get version
      description: Get the current API version
      operationId: getVersion
      responses:
        '200':
          description: Version information
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: string
                    example: 1.0.0

  /profiles:
    get:
      tags:
        - Profiles
      summary: List all profiles
      description: Retrieve a list of all browser profiles
      operationId: listProfiles
      parameters:
        - name: limit
          in: query
          description: Maximum number of profiles to return
          schema:
            type: integer
            default: 100
        - name: offset
          in: query
          description: Number of profiles to skip
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: List of profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Profile'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags:
        - Profiles
      summary: Create profile
      description: Create a new browser profile
      operationId: createProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProfileRequest'
      responses:
        '201':
          description: Profile created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /profiles/{profileId}:
    get:
      tags:
        - Profiles
      summary: Get profile
      description: Retrieve details of a specific profile
      operationId: getProfile
      parameters:
        - name: profileId
          in: path
          required: true
          description: Profile ID
          schema:
            type: string
      responses:
        '200':
          description: Profile details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '404':
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags:
        - Profiles
      summary: Update profile
      description: Update an existing profile
      operationId: updateProfile
      parameters:
        - name: profileId
          in: path
          required: true
          description: Profile ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '404':
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags:
        - Profiles
      summary: Delete profile
      description: Delete a browser profile
      operationId: deleteProfile
      parameters:
        - name: profileId
          in: path
          required: true
          description: Profile ID
          schema:
            type: string
      responses:
        '200':
          description: Profile deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '404':
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /profiles/run:
    post:
      tags:
        - Profiles
      summary: Launch profile
      description: Launch a browser profile with optional URL
      operationId: launchProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LaunchProfileRequest'
      responses:
        '200':
          description: Profile launched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LaunchResult'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /profiles/kill:
    post:
      tags:
        - Profiles
      summary: Stop profile
      description: Stop a running browser profile
      operationId: stopProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - profile_id
              properties:
                profile_id:
                  type: string
                  description: Profile ID to stop
      responses:
        '200':
          description: Profile stopped successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '404':
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /workflows:
    get:
      tags:
        - Workflows
      summary: List workflows
      description: Retrieve a list of all workflows
      operationId: listWorkflows
      responses:
        '200':
          description: List of workflows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Workflow'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags:
        - Workflows
      summary: Create workflow
      description: Create a new workflow
      operationId: createWorkflow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkflowRequest'
      responses:
        '201':
          description: Workflow created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workflow'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /workflows/{workflowId}/execute:
    post:
      tags:
        - Workflows
      summary: Execute workflow
      description: Execute a workflow on a specific profile
      operationId: executeWorkflow
      parameters:
        - name: workflowId
          in: path
          required: true
          description: Workflow ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - profile_id
              properties:
                profile_id:
                  type: string
                  description: Profile ID to execute on
      responses:
        '200':
          description: Workflow execution started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowExecution'
        '404':
          description: Workflow or profile not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /ai/task:
    post:
      tags:
        - AI
      summary: Run AI task
      description: Run an AI-powered automation task on a profile
      operationId: runAiTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunAiTaskRequest'
      responses:
        '200':
          description: AI task executed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiTaskResult'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /ai/task/{taskId}/status:
    get:
      tags:
        - AI
      summary: Get AI task status
      description: Get the current status of an AI task
      operationId: getAiTaskStatus
      parameters:
        - name: taskId
          in: path
          required: true
          description: Task ID
          schema:
            type: string
      responses:
        '200':
          description: Task status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiTaskStatus'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /ai/task/{taskId}/stop:
    post:
      tags:
        - AI
      summary: Stop AI task
      description: Stop a running AI task
      operationId: stopAiTask
      parameters:
        - name: taskId
          in: path
          required: true
          description: Task ID
          schema:
            type: string
      responses:
        '200':
          description: Task stopped
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /batch/profiles:
    post:
      tags:
        - Batch
      summary: Create profiles batch
      description: Create multiple profiles in a batch operation
      operationId: createProfilesBatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - profiles
              properties:
                profiles:
                  type: array
                  items:
                    $ref: '#/components/schemas/CreateProfileRequest'
                  description: List of profile configurations
                concurrent_limit:
                  type: integer
                  default: 5
                  description: Maximum concurrent operations
      responses:
        '200':
          description: Batch operation completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResult'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/profiles:
    get:
      tags:
        - Admin
      summary: Get all profiles (admin)
      description: Retrieve all profiles including sensitive data (admin only)
      operationId: adminGetAllProfiles
      security:
        - AdminToken: []
      responses:
        '200':
          description: All profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Profile'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/profiles/{profileId}:
    delete:
      tags:
        - Admin
      summary: Delete profile (admin)
      description: Force delete a profile without confirmation (admin only)
      operationId: adminDeleteProfile
      security:
        - AdminToken: []
      parameters:
        - name: profileId
          in: path
          required: true
          description: Profile ID
          schema:
            type: string
      responses:
        '200':
          description: Profile deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/export:
    get:
      tags:
        - Admin
      summary: Export all data (admin)
      description: Export all system data (admin only)
      operationId: adminExportAllData
      security:
        - AdminToken: []
      responses:
        '200':
          description: Export data
          content:
            application/json:
              schema:
                type: object
                properties:
                  profiles:
                    type: array
                    items:
                      $ref: '#/components/schemas/Profile'
                  workflows:
                    type: array
                    items:
                      $ref: '#/components/schemas/Workflow'
                  exported_at:
                    type: string
                    format: date-time
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/status:
    get:
      tags:
        - Admin
      summary: Get system status (admin)
      description: Get detailed system metrics (admin only)
      operationId: adminGetSystemStatus
      security:
        - AdminToken: []
      responses:
        '200':
          description: System status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemStatus'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    AdminToken:
      type: apiKey
      in: header
      name: X-Admin-Token
      description: Admin authentication token from DONUT_ADMIN_TOKEN environment variable

  schemas:
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Error message
        code:
          type: string
          description: Error code
        details:
          type: object
          description: Additional error details

    Profile:
      type: object
      required:
        - id
        - name
        - browser
      properties:
        id:
          type: string
          description: Profile ID
        name:
          type: string
          description: Profile name
        browser:
          type: string
          enum: [wayfern, camoufox]
          description: Browser engine
        proxy_id:
          type: string
          description: Associated proxy ID
        tags:
          type: array
          items:
            type: string
          description: Profile tags
        created_at:
          type: string
          format: date-time
          description: Creation timestamp
        updated_at:
          type: string
          format: date-time
          description: Last update timestamp
        status:
          type: string
          enum: [stopped, running, error]
          description: Current status

    CreateProfileRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Profile name
        browser:
          type: string
          enum: [wayfern, camoufox]
          default: wayfern
          description: Browser engine
        proxy_id:
          type: string
          description: Associated proxy ID
        tags:
          type: array
          items:
            type: string
          description: Profile tags

    UpdateProfileRequest:
      type: object
      properties:
        name:
          type: string
          description: Profile name
        proxy_id:
          type: string
          description: Associated proxy ID
        tags:
          type: array
          items:
            type: string
          description: Profile tags

    LaunchProfileRequest:
      type: object
      required:
        - profile_id
      properties:
        profile_id:
          type: string
          description: Profile ID to launch
        url:
          type: string
          format: uri
          description: Optional URL to open
        headless:
          type: boolean
          default: false
          description: Run in headless mode

    LaunchResult:
      type: object
      properties:
        success:
          type: boolean
        profile_id:
          type: string
        cdp_url:
          type: string
          description: CDP endpoint URL
        pid:
          type: integer
          description: Browser process ID

    Workflow:
      type: object
      required:
        - id
        - name
        - blocks
      properties:
        id:
          type: string
          description: Workflow ID
        name:
          type: string
          description: Workflow name
        description:
          type: string
          description: Workflow description
        blocks:
          type: array
          items:
            type: object
          description: Workflow blocks
        parameters:
          type: object
          description: Workflow parameters
        created_at:
          type: string
          format: date-time
          description: Creation timestamp
        updated_at:
          type: string
          format: date-time
          description: Last update timestamp

    CreateWorkflowRequest:
      type: object
      required:
        - name
        - blocks
      properties:
        name:
          type: string
          description: Workflow name
        description:
          type: string
          description: Workflow description
        blocks:
          type: array
          items:
            type: object
          description: Workflow blocks
        parameters:
          type: object
          description: Workflow parameters

    WorkflowExecution:
      type: object
      properties:
        execution_id:
          type: string
          description: Execution ID
        workflow_id:
          type: string
          description: Workflow ID
        profile_id:
          type: string
          description: Profile ID
        status:
          type: string
          enum: [pending, running, completed, failed]
          description: Execution status
        started_at:
          type: string
          format: date-time
          description: Start timestamp

    RunAiTaskRequest:
      type: object
      required:
        - profile_id
        - task_definition
      properties:
        profile_id:
          type: string
          description: Profile ID
        task_definition:
          type: string
          description: Natural language task description
        vision_enabled:
          type: boolean
          default: true
          description: Enable computer vision
        max_steps:
          type: integer
          default: 100
          description: Maximum number of steps

    AiTaskResult:
      type: object
      properties:
        task_id:
          type: string
          description: Task ID
        status:
          type: string
          enum: [pending, running, completed, failed]
          description: Task status
        result:
          type: object
          description: Task result data
        steps_taken:
          type: integer
          description: Number of steps executed

    AiTaskStatus:
      type: object
      properties:
        task_id:
          type: string
          description: Task ID
        status:
          type: string
          enum: [pending, running, completed, failed]
          description: Task status
        current_step:
          type: integer
          description: Current step number
        progress:
          type: number
          format: float
          description: Progress percentage (0-100)
        error:
          type: string
          description: Error message if failed

    BatchResult:
      type: object
      properties:
        total:
          type: integer
          description: Total operations
        successful:
          type: integer
          description: Successful operations
        failed:
          type: integer
          description: Failed operations
        results:
          type: array
          items:
            type: object
          description: Individual results
        errors:
          type: array
          items:
            type: object
          description: Error details for failed operations

    SystemStatus:
      type: object
      properties:
        uptime_seconds:
          type: integer
          description: Server uptime in seconds
        active_profiles:
          type: integer
          description: Number of active profiles
        total_profiles:
          type: integer
          description: Total number of profiles
        running_tasks:
          type: integer
          description: Number of running tasks
        memory_usage_mb:
          type: number
          description: Memory usage in MB
        cpu_usage_percent:
          type: number
          description: CPU usage percentage
        cache_stats:
          type: object
          properties:
            hits:
              type: integer
            misses:
              type: integer
            size:
              type: integer
            hit_rate:
              type: number
          description: Cache statistics
