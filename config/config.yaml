tibrain:
  port: 1810
  data_dir: "tibrain_data"
  allowed_roots:
    - "Z:\\01_PROJECTS\\apps\\tibrain"
    - "Z:\\02_CORE\\_cli\\.config"
    - "Z:\\02_CORE\\skills"
    - "Z:\\01_PROJECTS\\apps\\extension"

cli_registry:
  enabled: true

handoff_tracking:
  enabled: true

skill_sync:
  enabled: true

mcp:
  public_name: tibrain
  public_mode: unified
  expose_upstream_tools: false
  compatibility_aliases: false
  internal_hub:
    enabled: false
  targets:
    filesystem:
      server: 1mcp-local-bridge
    router:
      server: omniroute-router
    browser:
      server: browser-extension
    obsidian:
      server: obsidian-mcp-server